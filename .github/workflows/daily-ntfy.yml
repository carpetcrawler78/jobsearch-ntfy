name: Daily Ntfy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NTFY_TOPIC: jobsearch-8f3k2
        run: python src/main.py

#Kurz dazu:
#workflow_dispatch erlaubt manuelles Starten in GitHub.
#schedule läuft täglich um 07:00 UTC.
#Das Secret wird nur am Python-Schritt gesetzt, also schön eng begrenzt.
#NTFY_TOPIC passt zu https://ntfy.sh/jobsearch-8f3k2.
#Wichtig: Das YML allein reicht noch nicht vollständig, wenn src/main.py noch nicht auf GOOGLE_SERVICE_ACCOUNT_JSON ausgelegt ist