name: Ntfy Outbox

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke sends one safe test; outbox processes Google Sheets"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - outbox
  schedule:
    # Every five minutes, offset from the top of the hour to reduce queue delays.
    - cron: "3-58/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/ntfy-manual-test-trigger"

permissions:
  contents: read

concurrency:
  group: jobsearch-ntfy-outbox
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate ntfy configuration
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: test -n "$NTFY_TOPIC" || (echo "Missing Actions secret NTFY_TOPIC" && exit 1)

      - name: Send safe smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python src/main.py --smoke-test

      - name: Validate outbox configuration
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'outbox'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$NTFY_TOPIC" || (echo "Missing Actions secret NTFY_TOPIC" && exit 1)
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || (echo "Missing Actions secret GOOGLE_SERVICE_ACCOUNT_JSON" && exit 1)

      - name: Process NTFY_OUTBOX
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'outbox'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPREADSHEET_ID: 1BQJX4Kd0sYfROzbi1m0RoLJqfC2GJTUfuFBDxhkxmXo
          MAX_ATTEMPTS: "3"
          MAX_MESSAGES_PER_RUN: "10"
          GOOGLE_MAX_ATTEMPTS: "5"
        run: python src/main.py
